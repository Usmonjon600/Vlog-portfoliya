<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Loyiha</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css?v=4"> <!-- Cache buster -->
</head>
<body>
    <!-- LOGIN EKRANI -->
    <div id="login-screen" class="admin-container delta-dark-bg center-content">
        <div class="delta-dark-card">
            <h2 class="delta-title">Portfoliya Admin</h2>
            <p class="delta-subtitle">Tizimga kirish uchun PIN-kodni bosing</p>
            
            <!-- 4 Dots Indicator -->
            <div class="pin-dots" id="pin-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <p id="login-error" class="error-msg">Noto'g'ri PIN-kod!</p>

            <!-- Numeric Keypad -->
            <div class="numpad">
                <button class="num-btn" data-val="1">1</button>
                <button class="num-btn" data-val="2">2</button>
                <button class="num-btn" data-val="3">3</button>
                
                <button class="num-btn" data-val="4">4</button>
                <button class="num-btn" data-val="5">5</button>
                <button class="num-btn" data-val="6">6</button>
                
                <button class="num-btn" data-val="7">7</button>
                <button class="num-btn" data-val="8">8</button>
                <button class="num-btn" data-val="9">9</button>
                
                <button class="num-btn empty" disabled></button>
                <button class="num-btn" data-val="0">0</button>
                <button class="num-btn action-btn-pad" id="btn-backspace">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- DASHBOARD EKRANI -->
    <div id="dashboard-screen" class="admin-container" style="display: none;">
        <nav class="admin-nav glass-container">
            <h2 class="neon-text-sm">Boshqaruv Paneli</h2>
            <div class="admin-tabs">
                <button class="tab-btn active" data-target="projects-tab">Natijalar (Loyihalar)</button>
                <button class="tab-btn" data-target="services-tab">Xizmatlar</button>
                <button id="logout-btn" class="btn btn-outline" style="padding: 5px 15px;">Chiqish</button>
            </div>
        </nav>

        <main class="admin-main">
            <!-- PROJECTS TAB -->
            <div id="projects-tab" class="tab-content active">
                <div class="tab-header">
                    <h3>Loyihalar Ro'yxati</h3>
                    <button class="btn btn-primary" id="add-project-btn">+ Yangi Qo'shish</button>
                </div>
                <div class="glass-card">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Loyiha nomi (UZ)</th>
                                <th>Texnologiyalar</th>
                                <th>Amallar</th>
                            </tr>
                        </thead>
                        <tbody id="projects-tbody">
                            <!-- JS orqali to'ldiriladi -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- SERVICES TAB -->
            <div id="services-tab" class="tab-content" style="display: none;">
                <div class="tab-header">
                    <h3>Xizmatlar Ro'yxati</h3>
                    <button class="btn btn-primary" id="add-service-btn">+ Yangi Qo'shish</button>
                </div>
                <div class="glass-card" style="overflow-x: auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Xizmat nomi (UZ)</th>
                                <th>Narxi (UZ)</th>
                                <th>Amallar</th>
                            </tr>
                        </thead>
                        <tbody id="services-tbody">
                            <!-- JS orqali to'ldiriladi -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- PROJECT MODAL -->
    <div id="project-modal" class="modal-overlay" style="display: none;">
        <div class="glass-card modal-content admin-modal">
            <h3 id="project-modal-title">Loyiha qo'shish</h3>
            <div class="form-grid">
                <!-- UZ -->
                <div class="form-group">
                    <label>Nom (UZ)</label>
                    <input type="text" id="p_title_uz" class="glass-input">
                </div>
                <div class="form-group">
                    <label>Tavsif (UZ)</label>
                    <textarea id="p_desc_uz" class="glass-input"></textarea>
                </div>
                <!-- EN -->
                <div class="form-group">
                    <label>Nom (EN)</label>
                    <input type="text" id="p_title_en" class="glass-input">
                </div>
                <div class="form-group">
                    <label>Tavsif (EN)</label>
                    <textarea id="p_desc_en" class="glass-input"></textarea>
                </div>
                <!-- RU -->
                <div class="form-group">
                    <label>Nom (RU)</label>
                    <input type="text" id="p_title_ru" class="glass-input">
                </div>
                <div class="form-group">
                    <label>Tavsif (RU)</label>
                    <textarea id="p_desc_ru" class="glass-input"></textarea>
                </div>
                
                <div class="form-group full-width">
                    <label>Texnologiyalar (vergul bilan ajrating)</label>
                    <input type="text" id="p_tags" class="glass-input">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="document.getElementById('project-modal').style.display='none'">Bekor qilish</button>
                <button class="btn btn-primary" id="save-project-btn">Saqlash</button>
            </div>
        </div>
    </div>

    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async></script>
    <!-- Custom Scripts -->
    <script src="js/admin.js?v=10"></script>
    <!-- CACHE BUSTER 10: global fix -->
</body>
</html>
