<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Loyiha</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css?v=4"> <!-- Cache buster -->
</head>
<body>
    <!-- LOGIN EKRANI -->
    <div id="login-screen" class="admin-container delta-dark-bg center-content">
        <div class="delta-dark-card">
            <h2 class="delta-title">Portfoliya Admin</h2>
            <p class="delta-subtitle">Tizimga kirish uchun PIN-kodni bosing</p>
            
            <!-- 4 Dots Indicator -->
            <div class="pin-dots" id="pin-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <p id="login-error" class="error-msg">Noto'g'ri PIN-kod!</p>

            <!-- Numeric Keypad -->
            <div class="numpad">
                <button class="num-btn" data-val="1">1</button>
                <button class="num-btn" data-val="2">2</button>
                <button class="num-btn" data-val="3">3</button>
                
                <button class="num-btn" data-val="4">4</button>
                <button class="num-btn" data-val="5">5</button>
                <button class="num-btn" data-val="6">6</button>
                
                <button class="num-btn" data-val="7">7</button>
                <button class="num-btn" data-val="8">8</button>
                <button class="num-btn" data-val="9">9</button>
                
                <button class="num-btn empty" disabled></button>
                <button class="num-btn" data-val="0">0</button>
                <button class="num-btn action-btn-pad" id="btn-backspace">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" style="display: none; height: 100vh; width: 100vw; overflow: hidden; flex-direction: column; background: #0a0e17;">
        <div class="admin-nav" style="margin: 0; border-radius: 0; background: #111827; border-bottom: 1px solid #1f2937; padding: 10px 30px;">
            <div style="color: #0ea5e9; font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 10px;">
                <span style="display: inline-block; width: 10px; height: 10px; background: #0ea5e9; border-radius: 50%; box-shadow: 0 0 10px #0ea5e9; animation: pulse 2s infinite;"></span>
                Live Editor
            </div>
            <div style="display: flex; gap: 15px;">
                <button id="save-live-btn" class="btn" style="background: #0ea5e9; color: #fff;">💾 Saqlash</button>
                <button id="logout-btn" class="btn" style="background: rgba(255,255,255,0.1); color: #fff;">Chiqish</button>
            </div>
        </div>
        <iframe id="live-preview" style="flex: 1; width: 100%; border: none; background: #000;"></iframe>
    </div>

    <!-- Project Modal -->
    <div id="project-modal" class="modal-overlay" style="display: none;">
        <div class="admin-modal delta-dark-card" style="max-width: 600px; text-align: left;">
            <h3 id="project-modal-title" class="delta-title" style="margin-bottom: 20px;">Loyiha Qo'shish</h3>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="color: #9ca3af; display: block; margin-bottom: 5px;">Nomi (O'zbekcha)</label>
                <input type="text" id="p_title_uz" class="form-control" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 6px;">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="color: #9ca3af; display: block; margin-bottom: 5px;">Tavsif (O'zbekcha)</label>
                <textarea id="p_desc_uz" class="form-control" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 6px; height: 80px;"></textarea>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label style="color: #9ca3af; display: block; margin-bottom: 5px;">Nomi (Inglizcha)</label>
                <input type="text" id="p_title_en" class="form-control" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 6px;">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="color: #9ca3af; display: block; margin-bottom: 5px;">Tavsif (Inglizcha)</label>
                <textarea id="p_desc_en" class="form-control" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 6px; height: 80px;"></textarea>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label style="color: #9ca3af; display: block; margin-bottom: 5px;">Nomi (Ruscha)</label>
                <input type="text" id="p_title_ru" class="form-control" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 6px;">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="color: #9ca3af; display: block; margin-bottom: 5px;">Tavsif (Ruscha)</label>
                <textarea id="p_desc_ru" class="form-control" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 6px; height: 80px;"></textarea>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label style="color: #9ca3af; display: block; margin-bottom: 5px;">Texnologiyalar (vergul bilan ajrating)</label>
                <input type="text" id="p_tags" class="form-control" placeholder="React, Node.js, ..." style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 6px;">
            </div>
            
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="color: #9ca3af; display: block; margin-bottom: 5px;">Demo URL (ixtiyoriy)</label>
                <input type="url" id="p_demo" class="form-control" placeholder="https://..." style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 6px;">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn btn-secondary" onclick="document.getElementById('project-modal').style.display='none'" style="padding: 10px 15px; background: transparent; color: #9ca3af; border: 1px solid #374151; border-radius: 6px; cursor: pointer;">Bekor qilish</button>
                <button class="btn btn-primary" id="save-project-btn" style="padding: 10px 20px; background: #0ea5e9; color: white; border: none; border-radius: 6px; cursor: pointer;">Saqlash</button>
            </div>
        </div>
    </div>

    <!-- Service Modal -->
    <div id="service-modal" class="modal-overlay" style="display: none;">
        <div class="admin-modal delta-dark-card" style="max-width: 600px; text-align: left;">
            <h3 id="service-modal-title" class="delta-title" style="margin-bottom: 20px;">Xizmat Qo'shish</h3>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="color: #9ca3af; display: block; margin-bottom: 5px;">Xizmat Nomi</label>
                <input type="text" id="s_title" class="form-control" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 6px;">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="color: #9ca3af; display: block; margin-bottom: 5px;">Tavsif</label>
                <textarea id="s_desc" class="form-control" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 6px; height: 80px;"></textarea>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="color: #9ca3af; display: block; margin-bottom: 5px;">Imkoniyatlar (Har bir qatorga bittadan)</label>
                <textarea id="s_features" class="form-control" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 6px; height: 100px;"></textarea>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="color: #9ca3af; display: block; margin-bottom: 5px;">Narxi</label>
                <input type="text" id="s_price" class="form-control" placeholder="Masalan: 1,500,000 - 5,000,000 so'm" style="width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 6px;">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn btn-secondary" onclick="document.getElementById('service-modal').style.display='none'" style="padding: 10px 15px; background: transparent; color: #9ca3af; border: 1px solid #374151; border-radius: 6px; cursor: pointer;">Bekor qilish</button>
                <button class="btn btn-primary" id="save-service-btn" style="padding: 10px 20px; background: #0ea5e9; color: white; border: none; border-radius: 6px; cursor: pointer;">Saqlash</button>
            </div>
        </div>
    </div>

    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Custom Scripts -->
    <script src="js/admin.js?v=14"></script>
    <!-- CACHE BUSTER 14: global fix -->
</body>
</html>
